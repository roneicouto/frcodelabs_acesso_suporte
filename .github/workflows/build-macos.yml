name: Build macOS (FR CODE LABS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de compilação'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - full
          - qs
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run macOS Setup
        run: |
          bash scripts/setup-macos.sh

      - name: Build macOS DMGs
        run: |
          bash scripts/build-macos.sh ${{ github.event.inputs.profile || 'both' }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fr-code-labs-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
